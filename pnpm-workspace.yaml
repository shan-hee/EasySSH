packages:
  - web
  - desktop/EasySSHDesktop/frontend
  - packages/*
  - tooling/*
  - server/sync-runtime

# 两端共享的单例依赖与工具链统一版本，各包以 catalog: 引用。
catalog:
  # 前端与服务端同步进程必须使用同一 Automerge 版本处理同步文档。
  '@automerge/automerge': 3.5.0
  '@eslint/js': ^10.0.1
  '@tailwindcss/postcss': ^4.3.3
  '@tanstack/react-query': ^5.101.4
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  dockview: 8.2.0
  eslint: ^10.8.1
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.4
  i18next: ^26.3.6
  lucide-react: ^1.32.0
  motion: ^13.1.0
  react: 19.2.8
  react-dom: 19.2.8
  react-i18next: ^17.0.11
  react-router-dom: ^7.18.2
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  typescript: ^5.9.3
  typescript-eslint: ^8.67.0
  vite: ^8.2.1

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  '@tsparticles/engine': true
  '@vercel/speed-insights': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  '@assistant-ui/core': 0.3.22
  '@assistant-ui/store': 0.3.16
  '@assistant-ui/tap': 0.9.20
  # 约束间接依赖到已修复版本，避免上游锁定旧版本重新引入漏洞。
  'dompurify@<3.4.17': 3.4.17
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'zod@>=4.0.0 <4.6.6': 4.6.6
