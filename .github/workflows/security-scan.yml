name: Dependency Security Scan

# main 的依赖报告独立更新；标签发布的镜像报告不能代替默认分支扫描。
# 仅读取依赖文件，不安装项目依赖、不构建镜像、不运行测试。
on:
  push:
    branches: [main]
  schedule:
    # 每天北京时间 09:23，用最新漏洞库重新检查未变更的依赖。
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: 🔍 依赖安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5

      - name: 🔧 安装 Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      # 报告包含尚无修复版本的漏洞；成功不代表没有漏洞，结果见 Security → Code scanning
      - name: 🔍 Trivy 扫描依赖
        run: trivy fs --scanners vuln --severity CRITICAL,HIGH --format sarif --output trivy-dependencies.sarif .

      - name: 📤 上传依赖报告到 GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-dependencies.sarif'
          category: 'trivy-dependencies'
