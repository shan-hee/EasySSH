name: Build EasySSH Docker Image

# Docker 镜像构建：
#   - 正式发版由 release.yml (tag 触发) 调用本 workflow
#   - workflow_dispatch 用于按已有标签紧急重建镜像
on:
  workflow_call:
    inputs:
      version:
        description: '镜像版本号 (不含 v 前缀)'
        required: true
        type: string
      update-latest:
        description: '是否更新 latest 标签'
        required: false
        type: boolean
        default: true
    outputs:
      digest:
        description: '已扫描并发布的多架构镜像摘要'
        value: ${{ jobs.build.outputs.digest }}

  workflow_dispatch:
    inputs:
      version:
        description: '已有标签的版本号 (x.y.z，不含 v 前缀)'
        required: true
        type: string
      update-latest:
        description: '是否更新 latest 标签'
        required: true
        type: boolean
        default: false

env:
  DOCKER_IMAGE: shanhee/easyssh
  TRIVY_VERSION: v0.76.2

jobs:
  build:
    name: 🐳 Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      # 始终构建标签对应的代码，保证镜像内容与版本号一致
      - name: 📥 检出代码
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.update-latest }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: shanhee
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只按摘要推送、不打标签；扫描通过后才挂上正式标签
      - name: 🏗️ 构建并按摘要推送待扫描镜像
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: EASYSSH_VERSION=${{ inputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      # 第三方扫描器与推送凭据同处一个 job，必须锁定到 commit 和二进制版本
      - name: 🔧 安装 Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: 🔍 Trivy 扫描报告
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            trivy image --platform "linux/$arch" --severity CRITICAL,HIGH \
              --format sarif --output "trivy-linux-$arch.sarif" "$IMAGE"
          done

      - name: 📤 上传 amd64 报告
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-linux-amd64.sarif
          category: trivy-linux-amd64

      - name: 📤 上传 arm64 报告
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-linux-arm64.sarif
          category: trivy-linux-arm64

      - name: 🚧 Trivy 安全关卡 (可修复的 CRITICAL)
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            trivy image --platform "linux/$arch" --severity CRITICAL --ignore-unfixed \
              --exit-code 1 "$IMAGE"
          done

      - name: 🚀 为已扫描镜像挂上正式标签
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create "${TAG_ARGS[@]}" "$IMAGE"
