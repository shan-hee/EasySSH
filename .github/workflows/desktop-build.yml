name: Build EasySSH Desktop

# 桌面端构建（Wails v3, Windows 交叉编译）：
#   - 由 release.yml (tag 触发) 调用，默认构建 Windows amd64
#   - workflow_dispatch 可按已有标签手动选择架构，产物以 artifact 形式上传
on:
  workflow_call:
    inputs:
      version:
        description: '版本号 (不含 v 前缀)'
        required: true
        type: string
      arch:
        description: 'Windows 架构 (amd64 / arm64)'
        required: false
        type: string
        default: 'amd64'

  workflow_dispatch:
    inputs:
      version:
        description: '已有标签的版本号 (x.y.z，不含 v 前缀)'
        required: true
        type: string
      arch:
        description: 'Windows 架构'
        required: true
        type: choice
        default: 'amd64'
        options:
          - 'amd64'
          - 'arm64'

jobs:
  build:
    name: 💻 Windows ${{ inputs.arch }}
    runs-on: ubuntu-latest
    env:
      EASYSSH_VERSION: ${{ inputs.version }}
    defaults:
      run:
        working-directory: desktop/EasySSHDesktop
    steps:
      # 始终构建标签对应的代码，保证产物内容与版本号一致
      - name: 📥 检出代码
        uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}

      # exe 文件信息取自 info.json；仓库中为 0.0.0 占位，只在构建工作区写入版本
      - name: 🏷️ 写入 exe 版本信息
        run: |
          jq --arg v "$EASYSSH_VERSION" '.fixed.file_version = $v | .info["0000"].ProductVersion = $v' \
            build/windows/info.json > info.json.tmp
          mv info.json.tmp build/windows/info.json

      # wails3 generate bindings 按宿主 (Linux) 平台分析 Go 代码，需要 gtk/webkit 头文件，
      # 即使最终构建目标是 Windows
      - name: 🔧 安装 Linux 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 🔧 设置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop/EasySSHDesktop/go.mod
          cache-dependency-path: desktop/EasySSHDesktop/go.sum

      # 桌面端前端与共享应用包位于仓库根 pnpm 工作区
      - name: 🔧 设置 pnpm
        uses: pnpm/action-setup@v5
        with:
          package_json_file: package.json

      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🔧 安装 wails3 CLI (与 go.mod 版本一致)
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "安装 wails3 $WAILS_VERSION"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      - name: 🏗️ 构建 Windows 应用 (CGO=0 交叉编译)
        run: wails3 task windows:build ARCH=${{ inputs.arch }}

      - name: 📦 打包桌面端 zip
        run: cd bin && zip "EasySSH-windows-${{ inputs.arch }}-desktop.zip" EasySSH.exe

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: EasySSH-windows-${{ inputs.arch }}-desktop
          path: desktop/EasySSHDesktop/bin/EasySSH-windows-${{ inputs.arch }}-desktop.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
