              - warning
              - error
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 站内通知列表及未读数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxNotificationListResponse'
