  /health:
    get:
      operationId: getHealth
      tags:
        - monitoring
      summary: 健康检查
      description: 检查 API 服务状态
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: easyssh-api
  /oauth/authorize:
    get:
      operationId: beginOAuthAuthorization
      tags:
        - auth
      summary: 标准 OAuth 2.0 授权入口
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: nonce
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
      responses:
        '302':
          description: 跳转到 Provider 登录页面
    post:
      operationId: submitOAuthAuthorization
      tags:
        - auth
      summary: 使用邮箱密码 + PKCE 创建授权码
      description: |
        前端以 JSON 方式提交邮箱密码与 PKCE 参数，成功时返回授权码；
        如用户启用 2FA，则返回 requires_2fa=true 与临时令牌。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizeRequest'
      responses:
        '200':
          description: 授权码创建成功或需要 2FA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 认证失败（用户名或密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags:
        - auth
      summary: 使用授权码或 refresh_token 换取访问令牌
      description: |
        当 grant_type=authorization_code 时，从请求体读取授权码等参数；
        当 grant_type=refresh_token 时，从 HttpOnly Cookie 中读取 refresh_token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: 令牌签发成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: 请求参数错误或授权码无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: refresh_token 缺失或无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /oauth/logout:
    post:
      operationId: logoutOAuthSession
      tags:
        - auth
      summary: 用户登出
      description: |
        推荐的登出端点。浏览器会将 Path=/api/v1/oauth 的 refresh_token Cookie
        发送到该路径，后端可据此完整撤销 refresh token 与当前会话。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
