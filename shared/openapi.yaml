      description: 使用 Bearer 认证的 SSE 长连接。事件仅作为状态变化提示，客户端收到后应重新获取任务或通知的权威状态。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE 事件流，事件类型包括 task.created、task.updated、notification.created 和 notification.changed
          content:
            text/event-stream:
              schema:
                type: string
              example: >
                id: 92d459d5-3d5d-4e27-8e33-d326f99ebbf4

                event: task.updated

                data:
                {"id":"92d459d5-3d5d-4e27-8e33-d326f99ebbf4","type":"task.updated","data":{"task_id":"f65f87df-dd77-46e4-9535-24f192a596da"},"created_at":"2026-07-10T12:00:00Z"}
  /notifications:
    get:
