      tags:
        - backup
      summary: List managed native instance backups
      responses:
        '200':
          description: Backup history and capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupList'
    post:
      operationId: createInstanceBackup
      tags:
        - backup
      summary: Start an encrypted native backup in the background
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupPassword'
      responses:
        '202':
          description: Backup accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
        '409':
          description: Another backup operation is running
  /backup/instances/upload:
    post:
      operationId: uploadInstanceBackup
      tags:
        - backup
      summary: Upload an encrypted instance archive (maximum 16 GiB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded; password verification is still required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
  /backup/instances/{id}/download:
    get:
      operationId: downloadInstanceBackup
      tags:
        - backup
      summary: Download the encrypted instance archive
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
        - in: query
          name: ticket
          description: >-
            Single-use ticket scoped to this archive, obtained from POST /auth/ticket with type instance_backup_download
            and backup_id.
          schema:
            type: string
      responses:
        '200':
          description: Encrypted backup archive
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Backup not found
        '409':
          description: Another backup operation is running
  /backup/instances/{id}:
    delete:
      operationId: deleteInstanceBackup
      tags:
        - backup
      summary: Delete the archive and its history record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
      responses:
        '204':
          description: Backup deleted
        '404':
          description: Backup not found
        '409':
          description: Another backup operation is running
  /backup/instances/{id}/inspect:
    post:
      operationId: inspectInstanceBackup
      tags:
        - backup
      summary: Decrypt and verify a backup in the background
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupPassword'
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
        '404':
          description: Backup not found
        '409':
          description: Another backup operation is running
  /backup/instances/{id}/restore:
    post:
      operationId: restoreInstanceBackup
      tags:
        - backup
      summary: Restore into a new directory; the active instance is not switched
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupPassword'
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
        '404':
          description: Backup not found
        '409':
          description: Another backup operation is running
  /backup/instances/{id}/activate:
    post:
      operationId: activateRestoredInstance
      tags:
        - backup
      summary: Activate a restored Windows local SQLite instance and restart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceActivationRequest'
      responses:
        '202':
          description: Activation accepted; use the operation ID to track restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceActivationOperation'
        '400':
          description: Invalid confirmation or restored directory
        '401':
          description: Authentication required
        '403':
          description: Backup management permission required
        '409':
          description: Busy or activation unavailable
  /backup/activation/rollback:
    post:
      operationId: rollbackActiveInstance
      tags:
        - backup
      summary: Restart the previous local instance without merging data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceActivationRequest'
      responses:
        '202':
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceActivationOperation'
        '400':
          description: Confirmation required
        '401':
          description: Authentication required
        '403':
          description: Backup management permission required
        '409':
          description: Busy or no previous instance
  /backup/activation/status/{operationId}:
    get:
      operationId: getInstanceActivationStatus
      tags:
        - backup
      summary: Read only the restart outcome using an unguessable operation ID
      security: []
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Restart status, without credentials or instance paths
