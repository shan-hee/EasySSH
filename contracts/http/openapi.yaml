              schema:
                $ref: '#/components/schemas/InstanceBackupList'
      security:
      - ownerCookie: []
    post:
      operationId: createInstanceBackup
      tags:
      - backup
      summary: Start an encrypted native backup in the background
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupPassword'
      responses:
        '202':
          description: Backup accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
        '409':
          description: Another backup operation is running
      security:
      - ownerCookie: []
  /backup/instances/upload:
    post:
      operationId: uploadInstanceBackup
      tags:
      - backup
      summary: Upload an encrypted instance archive (maximum 16 GiB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded; password verification is still required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceBackupRecord'
      security:
      - ownerCookie: []
  /backup/instances/{id}/download:
    get:
      operationId: downloadInstanceBackup
      tags:
      - backup
      summary: Download the encrypted instance archive
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{32}$
      - in: query
        name: ticket
        description: Single-use ticket scoped to this archive, obtained from POST /auth/ticket with type instance_backup_download
          and backup_id.
        schema:
          type: string
      responses:
        '200':
          description: Encrypted backup archive
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Backup not found
        '409':
          description: Another backup operation is running
      security:
      - singleUseTicket: []
  /backup/instances/{id}:
    delete:
      operationId: deleteInstanceBackup
