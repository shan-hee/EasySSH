      - name: limit
        in: query
        schema:
          type: integer
          default: 30
          maximum: 100
      - name: q
        in: query
        description: 按会话标题或消息快照文本搜索。
        schema:
          type: string
      - name: scope_kind
        in: query
        description: 按 AI 会话作用域过滤，例如 terminal 表示终端页签范围。
        schema:
          type: string
          enum:
          - global
          - terminal
