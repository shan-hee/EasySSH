        in: query
        description: 终端页签会话 ID，用于恢复当前终端的 AI 会话。
        schema:
          type: string
      - name: server_id
        in: query
        description: 当前终端连接的服务器 ID，用于限定终端 AI 会话。
        schema:
          type: string
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAISessionsResponse'
