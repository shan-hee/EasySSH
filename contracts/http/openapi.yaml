openapi: 3.0.3
info:
  title: EasySSH API
  description: 'EasySSH 单一所有者个人工作区 HTTP API


    ## 功能模块

    - 所有者身份与授权链接访问

    - 服务器管理（CRUD）

    - SSH 连接与终端

    - SFTP 文件传输

    - 批量操作与脚本执行

    - 系统监控与日志

    '
  version: 1.0.0
  contact:
    name: EasySSH Team
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api/v1
  description: 当前 EasySSH 实例
tags:
- name: auth
  description: 所有者身份认证
- name: servers
  description: 服务器管理
- name: ssh
  description: SSH 连接
- name: sftp
  description: SFTP 文件管理
- name: scripts
  description: 脚本管理
- name: batch
  description: 批量操作
- name: monitoring
  description: 监控与健康检查
- name: logs
  description: 日志管理
- name: backup
  description: 统一备份导出与恢复
- name: ai
  description: AI Agent 会话运行时
- name: tasks
  description: 统一任务运行与控制
- name: notifications
  description: 工作区通知
- name: realtime
  description: 工作区任务与通知实时事件
components:
  securitySchemes:
    automationToken:
      type: http
      scheme: bearer
      description: Revocable ess_api_ credential bound to an explicit resource grant.
    ownerCookie:
      type: apiKey
      in: cookie
      name: easyssh_owner
      description: HttpOnly、SameSite=Strict；HTTPS 时 Secure。修改请求须携带 X-CSRF-Token。
    accessCookie:
      type: apiKey
      in: cookie
      name: easyssh_access
      description: 浏览器访问容器；需搭配 X-EasySSH-Access-Session，修改请求还需 X-CSRF-Token 和同源 Origin。
    accessSession:
      type: apiKey
      in: header
      name: X-EasySSH-Access-Session
    nativeAccess:
      type: apiKey
      in: header
      name: Authorization
      description: 原生客户端使用 Access <session_token>，禁止 Origin；凭据不得放入 URL。
    syncDeviceAuth:
      type: http
      scheme: bearer
      description: Revocable device-only synchronization credential
    singleUseTicket:
      type: apiKey
      in: query
      name: ticket
      description: 由 /access/tickets 签发的一次性票据；固定目标、权限与有效期，只可消费一次。此类握手和下载必须使用票据。
  parameters:
    ConnectionHeader:
      name: X-EasySSH-Connection
      in: header
      required: true
      description: POST /connections 返回的逻辑连接 ID，必须属于当前身份和目标服务器；该请求头不是认证凭据。
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    TicketConnectionHeader:
      name: X-EasySSH-Connection
      in: header
      required: false
      description: WebSocket 使用 ticket 内绑定的逻辑连接；浏览器无需设置此头。若提供，必须与票据中的连接 ID 相同。
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ServerID:
      name: server_id
      in: path
      required: true
      schema:
        type: string
    ServerIDCamel:
      name: serverId
      in: path
      required: true
      schema:
        type: string
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Message:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NoContent:
      description: 操作成功，无响应体
  schemas:
    ChatConnection:
      type: object
      required:
      - provider
      - id
      - name
      - bot_username
      - server_ids
      - permission_mode
      - enabled
      - status
      - last_poll_at
      - last_error
      - created_at
      - updated_at
      properties:
        provider:
          type: string
          enum: [telegram, feishu]
          x-enum-varnames: [ChatProviderTelegram, ChatProviderFeishu]
          description: Chat platform. Existing connections use telegram.
        app_id:
          type: string
          description: Feishu internal application ID; omitted for Telegram.
        id:
          type: string
        name:
          type: string
        bot_username:
          type: string
        server_ids:
          type: array
          items:
            type: string
        permission_mode:
          type: string
          enum:
          - readonly
          - balanced
          x-enum-varnames: [ChatPermissionReadonly, ChatPermissionBalanced]
        enabled:
          type: boolean
        status:
          type: string
          enum:
          - disabled
          - connecting
          - connected
          - error
        last_poll_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatConnectionInput:
      type: object
      required:
      - name
      - server_ids
      - permission_mode
      - enabled
      properties:
        provider:
          type: string
          enum: [telegram, feishu]
          x-enum-varnames: [ChatInputProviderTelegram, ChatInputProviderFeishu]
          description: Defaults to telegram on creation; omitted on update preserves the platform. Cannot change an existing connection's platform.
        app_id:
          type: string
          maxLength: 100
          description: Required for a new Feishu connection. Empty preserves the existing application on update; switching applications requires a new connection.
        app_secret:
          type: string
          maxLength: 1024
          writeOnly: true
          description: Required for a new Feishu connection; empty preserves the encrypted secret on update. Never returned by the API.
        name:
          type: string
          minLength: 1
          maxLength: 100
        token:
          type: string
          writeOnly: true
          description: Required when creating a Telegram connection; empty preserves the existing token on update. Not used for Feishu.
        server_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        permission_mode:
          type: string
          enum:
          - readonly
          - balanced
          x-enum-varnames: [ChatInputReadonly, ChatInputBalanced]
        enabled:
          type: boolean
    ChatBinding:
      type: object
      required:
      - id
      - connection_id
      - user_id
      - display_name
      - current_session_id
      - revoked_at
      - created_at
      properties:
        external_user_id:
          type: string
          description: Feishu open_id. The legacy user_id is retained and is "0" for Feishu bindings.
        id:
          type: string
        connection_id:
          type: string
        user_id:
          type: string
        display_name:
          type: string
        current_session_id:
          type: string
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    ChatConnectionDetail:
      type: object
      required:
      - connection
      - bindings
      properties:
        connection:
          $ref: '#/components/schemas/ChatConnection'
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/ChatBinding'
    ChatBindCode:
      type: object
      required:
      - code
      - url
      - expires_at
      properties:
        command:
          type: string
          description: Send this /bind command in the bot private chat. Required for Feishu; Telegram also supports the returned deep link.
        code:
          type: string
        url:
          type: string
        expires_at:
          type: string
          format: date-time
    ChatSession:
      type: object
      required: [id, binding_id, display_name, status, preview, updated_at]
      properties:
        id:
          type: string
        binding_id:
          type: string
        display_name:
          type: string
        status:
          type: string
        preview:
          type: string
        updated_at:
          type: string
          format: date-time
    ChatTranscriptMessage:
      type: object
      description: One bot message as the chat app shows it, rebuilt with the bot's own formatting.
      required: [id, from, text, buttons, created_at]
      properties:
        id:
          type: string
        from:
          type: string
          enum: [user, bot]
          x-enum-varnames: [ChatMessageFromUser, ChatMessageFromBot]
        text:
          type: string
        buttons:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    ChatConnectionEnabled:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    AutomationToken:
      type: object
      required: [id, name, grant_id, grant_name, created_at, expires_at, active]
      properties:
        active: {type: boolean}
        id: {type: string, format: uuid}
        name: {type: string}
        grant_id: {type: string, format: uuid}
        grant_name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
    CreateAutomationToken:
      type: object
      required: [name, expires_at]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        grant_id: {type: string, format: uuid}
        authorization:
          $ref: "#/components/schemas/CreateGrantInput"
        expires_at: {type: string, format: date-time}
    AutomationTokenCreated:
      type: object
      required: [token, metadata]
      properties:
        token: {type: string, description: Only returned once; never logged or stored in plaintext.}
        metadata: {$ref: '#/components/schemas/AutomationToken'}
    RDPConfig:
      type: object
      required: [server_id, enabled, port, security, ignore_certificate]
      properties:
        server_id: {type: string, format: uuid}
        enabled: {type: boolean}
        port: {type: integer, minimum: 1, maximum: 65535}
        security: {type: string, enum: [nla, tls]}
        ignore_certificate: {type: boolean, description: Explicitly trust an unverified RDP server certificate.}
    VNCConfig:
      type: object
      required: [server_id, enabled, port, tls]
      properties:
        server_id: {type: string, format: uuid}
        enabled: {type: boolean}
        port: {type: integer, minimum: 1, maximum: 65535}
        tls: {type: boolean, description: TLS from EasySSH to the saved server host with certificate validation.}
    PublicBranding:
      type: object
      description: 未登录页面可读取的实例展示信息；不包含存储路径、队列、传输或安全设置。
      required:
      - system_name
      - system_logo
      - system_favicon
      - default_language
      properties:
        system_name:
          type: string
        system_logo:
          type: string
        system_favicon:
          type: string
        default_language:
          type: string
    ScriptListResponse:
      type: object
      required:
      - data
      - total
      - page
      - page_size
      - total_pages
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Script'
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
    Kind:
      type: string
      enum:
      - owner
      - device
      - access_session
      x-enum-varnames:
      - Owner
      - Device
      - Visitor
    Action:
      type: string
      enum:
      - workspace.read
      - owner.manage
      - resources.manage
      - credentials.read
      - grants.manage
      - backup.manage
      - sync.read
      - sync.write
      - activity.read
      - terminal.connect
      - vnc.connect
      - rdp.connect
      - files.list
      - files.read
      - files.download
      - files.upload
      - files.write
      - files.delete
      - monitor.read
      - docker.read
      - docker.manage
      - scripts.execute
      - ai.use
      x-enum-varnames:
      - WorkspaceRead
      - OwnerManage
      - ResourcesManage
      - CredentialsRead
      - GrantsManage
      - BackupManage
      - SyncRead
      - SyncWrite
      - ActivityRead
      - TerminalConnect
      - VNCConnect
      - RDPConnect
      - FilesList
      - FilesRead
      - FilesDownload
      - FilesUpload
      - FilesWrite
      - FilesDelete
      - MonitorRead
      - DockerRead
      - DockerManage
      - ScriptsExecute
      - AIUse
    Actor:
      type: object
      required:
      - kind
      - id
      - session_id
      properties:
        kind:
          $ref: '#/components/schemas/Kind'
        id:
          type: string
        session_id:
          type: string
        grant_id:
          type: string
          x-go-type-skip-optional-pointer: true
      description: 执行归属信息，不构成授权凭据；本机所有者 ID 不要求 UUID。所有者后台自动任务的 session_id 为空，不创建登录会话；访客和设备必须关联真实会话。
    ConnectionMode:
      type: string
      enum:
      - terminal
      - files
      - monitor
      - docker
      - vnc
      - rdp
      x-enum-varnames:
      - TerminalConnection
      - FilesConnection
      - MonitorConnection
      - DockerConnection
      - VNCConnection
      - RDPConnection
    ConnectionInfo:
      type: object
      required:
      - id
      - server_id
      - mode
      - heartbeat_seconds
      properties:
        id:
          type: string
          pattern: ^[0-9a-f]{32}$
        server_id:
          type: string
          format: uuid
          x-go-type: string
        mode:
          $ref: '#/components/schemas/ConnectionMode'
        heartbeat_seconds:
          type: integer
    CreateConnectionInput:
      type: object
      required:
      - server_id
      - mode
      properties:
        server_id:
          type: string
          format: uuid
          x-go-type: string
        mode:
          $ref: '#/components/schemas/ConnectionMode'
    AccessProtocolVersion:
      type: integer
      enum:
      - 1
      x-enum-varnames:
      - AccessVersion
    AccessResource:
      type: object
      required:
      - id
      - name
      - host
      - port
      - username
      - actions
      - paused
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        paused:
          type: boolean
    AccessContext:
      type: object
      required:
      - protocol_version
      - actor
      - grant_name
      - default_content
      - expires_at
      - max_connections
      - resources
      properties:
        protocol_version:
          $ref: '#/components/schemas/AccessProtocolVersion'
        actor:
          $ref: '#/components/schemas/Actor'
        grant_name:
          type: string
        default_content:
          type: string
        expires_at:
          type: string
          format: date-time
        max_connections:
          type: integer
        resources:
          type: array
          items:
            $ref: '#/components/schemas/AccessResource'
    AccessExchangeInput:
      type: object
      required:
      - public_id
      - secret
      - client_kind
      - protocol_min
      - protocol_max
      properties:
        public_id:
          type: string
          maxLength: 64
        secret:
          type: string
          maxLength: 128
        client_kind:
          type: string
          enum:
          - browser
          - desktop
          x-go-type: string
          x-go-type-skip-optional-pointer: true
        protocol_min:
          type: integer
          minimum: 1
        protocol_max:
          type: integer
          minimum: 1
    DesktopAccessExchange:
      type: object
      required:
      - context
      - session_token
      properties:
        context:
          $ref: '#/components/schemas/AccessContext'
        session_token:
          type: string
      description: 仅原生客户端持有 session_token，不得透传到渲染窗口。
    BrowserAccessExchange:
      type: object
      required:
      - context
      - csrf_token
      properties:
        context:
          $ref: '#/components/schemas/AccessContext'
        csrf_token:
          type: string
    AccessHandoff:
      type: object
      required:
      - id
      - receiver_name
      - confirmation
      - expires_at
      - approved_at
      - consumed_at
      properties:
        id:
          type: string
          format: uuid
        receiver_name:
          type: string
        confirmation:
          type: string
        expires_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
        consumed_at:
          type: string
          format: date-time
          nullable: true
    BindAccessHandoffInput:
      type: object
      required:
      - challenge
      - name
      properties:
        challenge:
          type: string
          pattern: ^[0-9a-f]{64}$
        name:
          type: string
          minLength: 1
          maxLength: 100
    ApproveAccessHandoffInput:
      type: object
      required:
      - confirmation
      properties:
        confirmation:
          type: string
    ClaimAccessHandoffInput:
      type: object
      required:
      - verifier
      - protocol_min
      - protocol_max
      properties:
        verifier:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        protocol_min:
          type: integer
          minimum: 1
        protocol_max:
          type: integer
          minimum: 1
    ProtocolMismatchError:
      type: object
      required:
      - error
      - protocol_version
      properties:
        error:
          type: string
          enum:
          - protocol_mismatch
          x-go-type: string
          x-go-type-skip-optional-pointer: true
        protocol_version:
          $ref: '#/components/schemas/AccessProtocolVersion'
    OwnerPublic:
      type: object
      required:
      - id
      - username
      - email
      - avatar
      - language
      - timezone
      - two_factor_enabled
      - notify_email_login
      - notify_email_alert
      - notify_browser
      - notify_new_device
      - notify_new_location
      - notify_suspicious
      - notify_task_in_app
      - notify_task_success
      - notify_task_failure
      - notify_task_partial
      - notify_task_external
      - monitor_data_source
      - nezha_api_endpoint
      - nezha_api_token_set
      - komari_api_endpoint
      - komari_api_token_set
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        language:
          type: string
        timezone:
          type: string
        two_factor_enabled:
          type: boolean
        notify_email_login:
          type: boolean
        notify_email_alert:
          type: boolean
        notify_browser:
          type: boolean
        notify_new_device:
          type: boolean
        notify_new_location:
          type: boolean
        notify_suspicious:
          type: boolean
        notify_task_in_app:
          type: boolean
        notify_task_success:
          type: boolean
        notify_task_failure:
          type: boolean
        notify_task_partial:
          type: boolean
        notify_task_external:
          type: boolean
        monitor_data_source:
          type: string
        nezha_api_endpoint:
          type: string
        nezha_api_token_set:
          type: boolean
        komari_api_endpoint:
          type: string
        komari_api_token_set:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OwnerLoginResult:
      type: object
      required:
      - owner
      - session_id
      - expires_at
      - csrf_token
      properties:
        owner:
          $ref: '#/components/schemas/OwnerPublic'
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    OwnerStatus:
      type: object
      required:
      - initialized
      - authenticated
      properties:
        initialized:
          type: boolean
        authenticated:
          type: boolean
        owner:
          $ref: '#/components/schemas/OwnerPublic'
        session_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    OwnerInitializeInput:
      type: object
      required:
      - username
      - email
      - password
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
    OwnerLoginInput:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
        password:
          type: string
        code:
          type: string
          x-go-type-skip-optional-pointer: true
        remember:
          type: boolean
          x-go-type-skip-optional-pointer: true
    OwnerProfileInput:
      type: object
      required:
      - username
      - email
      properties:
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
          maxLength: 1048576
          x-go-type-skip-optional-pointer: true
        language:
          type: string
          maxLength: 20
          x-go-type-skip-optional-pointer: true
        timezone:
          type: string
          x-go-type-skip-optional-pointer: true
    OwnerPasswordInput:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
    OwnerTwoFactorSetupInput:
      type: object
      required:
      - password
      properties:
        password:
          type: string
    OwnerTwoFactorCodeInput:
      type: object
      required:
      - code
      properties:
        code:
          type: string
    OwnerTwoFactorSetup:
      type: object
      required:
      - secret
      - otpauth_uri
      - expires_in
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
        expires_in:
          type: integer
    OwnerRecoveryCodes:
      type: object
      required:
      - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    CSRFToken:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    OwnerNotificationsInput:
      type: object
      required: []
      properties:
        notify_email_login:
          type: boolean
        notify_email_alert:
          type: boolean
        notify_browser:
          type: boolean
        notify_new_device:
          type: boolean
        notify_new_location:
          type: boolean
        notify_suspicious:
          type: boolean
        notify_task_in_app:
          type: boolean
        notify_task_success:
          type: boolean
        notify_task_failure:
          type: boolean
        notify_task_partial:
          type: boolean
        notify_task_external:
          type: boolean
      additionalProperties: false
    OwnerMonitorInput:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - easyssh
          - nezha
          - komari
          x-go-type: string
          x-go-type-skip-optional-pointer: true
        endpoint:
          type: string
          maxLength: 4096
          description: 省略保留该来源的地址；显式空字符串清除。非空值为不含凭据、查询参数或片段的 HTTP(S) 地址。
        token:
          type: string
          maxLength: 16384
