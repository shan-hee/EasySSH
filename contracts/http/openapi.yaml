paths:
  /chat-connections:
    get:
      operationId: listChatConnections
      summary: List owner chat connections
      tags:
      - ai
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatConnection'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChatConnection
      summary: Create a private Telegram Agent connection
      tags:
      - ai
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConnection'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatConnectionInput'
  /chat-connections/{id}:
    get:
      operationId: getChatConnection
      summary: Get bindings and the latest 100 chat conversations
      tags:
      - ai
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConnectionDetail'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updateChatConnection
      summary: Update configuration and stop existing work
      tags:
      - ai
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatConnection'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatConnectionInput'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteChatConnection
      summary: Stop and delete a chat connection
      tags:
      - ai
      security:
      - ownerCookie: []
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
