  /ai/sessions/{session_id}/chat:
    post:
      operationId: postAiSessionsSessionIdChat
      tags:
      - ai
      summary: AI SDK UI 标准聊天流
      description: '接收 Vercel AI SDK UI `DefaultChatTransport` 请求体，并返回 `UIMessageChunk` SSE。

        响应头包含 `X-Vercel-AI-UI-Message-Stream: v1`，每个 `data:` 载荷都是一个 AI SDK UIMessageChunk JSON 对象，流结束时发送 `data: [DONE]`。

        EasySSH 的 context/model/permission_mode/scope/approval 字段是标准 UI 协议外的附加能力。

        '
      security:
      - ownerCookie: []
      - accessCookie: []
        accessSession: []
      - nativeAccess: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISDKChatRequest'
      responses:
        '200':
          description: AI SDK UI message stream
          headers:
            X-Vercel-AI-UI-Message-Stream:
              schema:
                type: string
                enum:
                - v1
              description: AI SDK UI message stream version
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AIUIMessageChunk'
              description: SSE data 载荷为 AIUIMessageChunk JSON；结束帧为 [DONE]。
              examples:
                textDelta:
                  summary: 文本增量
                  value: 'data: {"type":"start","messageId":"assistant-message-id"}


                    data: {"type":"text-start","id":"assistant-message-id:text:0"}


                    data: {"type":"text-delta","id":"assistant-message-id:text:0","delta":"你好"}


                    data: {"type":"text-end","id":"assistant-message-id:text:0"}


                    data: {"type":"finish","finishReason":"stop"}


                    data: [DONE]

                    '
        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 会话当前不可接受新消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
