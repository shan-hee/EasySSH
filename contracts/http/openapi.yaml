  /ai/sessions/{session_id}/history:
    get:
      operationId: getAIHistory
      tags: [ai]
      summary: 按游标分页读取 AI 公开历史
      description: 按消息或工具的会话内顺序读取。持久历史仅查询本页条目，不恢复整个运行会话；活跃会话允许包含正在生成的内容。每页最多 100 项、512 KiB。该接口遵守会话归属，所有者的不同登录会话共享历史，访客访问会话彼此隔离。
      security:
      - ownerCookie: []
      - accessCookie: []
        accessSession: []
      - nativeAccess: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum: [messages, tasks]
      - name: after_id
        in: query
        schema:
          type: string
          maxLength: 256
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: 本页公开历史与下一页游标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIHistoryPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
